version: 2
updates:
  # npm dependencies across the whole workspace (single root lockfile).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Roll routine minor/patch bumps into one PR to cut noise. Majors still
      # get their own PR so breaking changes get individual review.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # tsup の d.ts 生成は同梱の rollup-plugin-dts に依存しており、これが
      # TypeScript 7 の API 変更に追随していない。全パッケージが dts: true
      # なので major を上げると build が丸ごと落ちる (#138)。tsup 側が
      # TypeScript 7 に対応したらこの ignore を外す。
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Keep the GitHub Actions used by the workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
