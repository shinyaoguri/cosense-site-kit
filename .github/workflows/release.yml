name: Release

on:
  push:
    branches: [main]

# Don't let two release runs race.
concurrency: release-${{ github.ref }}

# Read-only by default. Only the `release` job below gets write / OIDC
# permissions, and it runs no dependency install scripts, builds or tests:
# third-party code (npm lifecycle scripts, test-time imports) runs in `verify`,
# which can't publish or push. Every action is SHA-pinned (with the version in a
# comment) so a moved tag can't inject code; dependabot updates the pins.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gate the release on the same checks as ci.yml — nothing should reach
      # npm without passing build + tests + lint + typecheck.
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      # Hand the verified build to the publishing job, which must not rebuild.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 1

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "Version Packages" commit + tags
      pull-requests: write # open/update the Version Packages PR
      id-token: write # mint the OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24's bundled npm may
      # be older, so upgrade explicitly. Pinned to an exact version (not the
      # moving `@latest` dist-tag) so an npm supply-chain incident can't flow
      # straight into this publish-capable job. Bump deliberately.
      - run: npm install -g npm@11.5.1

      # The changesets CLI is needed here, but no dependency may run its install
      # scripts in a job that holds the OIDC token.
      - run: npm ci --ignore-scripts

      # Unpacks to packages/<name>/dist (upload-artifact roots the archive at
      # the least common ancestor of the glob, i.e. packages/).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: packages

      # On a push that contains changesets, this opens/updates a "Version
      # Packages" PR (running `version`). When that PR is merged — changesets
      # consumed, versions bumped — the next run finds no changesets and runs
      # `publish` instead, publishing to npm and tagging the release.
      - name: Version or publish
        # SHA-pinned (not the movable `v2` tag): this job can publish to npm, so
        # a hijacked tag must not be able to run arbitrary code here. Bump the
        # SHA (and the version comment) deliberately; dependabot updates SHA pins.
        #
        # The action major and @changesets/cli major move together — v2 refuses a
        # CLI v2 project outright — and v2 renamed every input, so a lone SHA bump
        # breaks releases silently (unknown inputs are only a warning). The guards
        # in test/dependency-consistency.test.ts fail CI on either drift.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npx changeset version
          # Publish the artifact built and tested in `verify` — `npm run release`
          # would rebuild here, running the build toolchain with the OIDC token.
          publish-script: npx changeset publish
          # v2 defaults both to "Version Packages"; keep them Conventional
          # Commits because the squash merge turns the title into main's summary.
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # v2 ignores the GITHUB_TOKEN environment variable — the input is the
          # only channel. No npm token anywhere: auth comes from OIDC trusted
          # publishing (`id-token: write` above).
          github-token: ${{ secrets.GITHUB_TOKEN }}
