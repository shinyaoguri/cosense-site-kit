name: Release

on:
  push:
    branches: [main]

# Don't let two release runs race.
concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the "Version Packages" commit + tags
  pull-requests: write # open/update the Version Packages PR
  id-token: write # mint the OIDC token for npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24's bundled npm may
      # be older, so upgrade explicitly. Pinned to an exact version (not the
      # moving `@latest` dist-tag) so an npm supply-chain incident can't flow
      # straight into this publish-capable job. Bump deliberately.
      - run: npm install -g npm@11.5.1

      - run: npm ci

      # Gate the release on the same checks as ci.yml — nothing should reach
      # npm without passing build + tests + lint + typecheck.
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      # On a push that contains changesets, this opens/updates a "Version
      # Packages" PR (running `version`). When that PR is merged — changesets
      # consumed, versions bumped — the next run finds no changesets and runs
      # `publish` instead, publishing to npm and tagging the release.
      - name: Version or publish
        # SHA-pinned (not the movable `v2` tag): this job can publish to npm, so
        # a hijacked tag must not be able to run arbitrary code here. Bump the
        # SHA (and the version comment) deliberately; dependabot updates SHA pins.
        #
        # The action major and @changesets/cli major move together — v2 refuses a
        # CLI v2 project outright — and v2 renamed every input, so a lone SHA bump
        # breaks releases silently (unknown inputs are only a warning). The guards
        # in test/dependency-consistency.test.ts fail CI on either drift.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: npx changeset version
          publish-script: npm run release
          # v2 defaults both to "Version Packages"; keep them Conventional
          # Commits because the squash merge turns the title into main's summary.
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # v2 ignores the GITHUB_TOKEN environment variable — the input is the
          # only channel. No npm token anywhere: auth comes from OIDC trusted
          # publishing (`id-token: write` above).
          github-token: ${{ secrets.GITHUB_TOKEN }}
